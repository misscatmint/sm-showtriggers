name: Set up SourceMod
description: Installs a pinned SourceMod build and puts its scripting folder in SMDIR and its compiler in SPCOMP.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SOURCEMOD: https://github.com/alliedmodders/sourcemod/releases/download/1.12.0.7255/sourcemod-1.12.0-git7255-linux.tar.gz
        SOURCEMOD_SHA256: 02be752ddc25d344a379800df9395a2847ab85b71acea9167fdca8163010d5b9
      run: |
        curl -fsSL -o "$RUNNER_TEMP/sourcemod.tar.gz" "$SOURCEMOD"
        echo "$SOURCEMOD_SHA256  $RUNNER_TEMP/sourcemod.tar.gz" | sha256sum -c -
        mkdir "$RUNNER_TEMP/sourcemod"
        tar -xzf "$RUNNER_TEMP/sourcemod.tar.gz" -C "$RUNNER_TEMP/sourcemod"
        SMDIR="$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting"
        echo "SMDIR=$SMDIR" >> "$GITHUB_ENV"
        # spcomp finds its includes next to the path it was started by.
        echo "SPCOMP=$SMDIR/spcomp64" >> "$GITHUB_ENV"
